# Windows 安装包：npm run dist:win → release/LyriStage-Setup-版本.exe
appId: com.jting904.lyristage
productName: LyriStage
copyright: LyriStage（基于 YesPlayMusic，MIT）
directories:
  buildResources: build
  output: release
files:
  - out/**
  - resources/**
  - package.json
asarUnpack:
  # 托盘 / 窗口图标要是真的文件
  - resources/**
  # 网易云 API 运行时会扫描、读写自己的目录；解灰的音源也放在外面比较保险
  - node_modules/@neteasecloudmusicapienhanced/api/**
  - node_modules/@unblockneteasemusic/server/**
protocols:
  # GitHub 登录回调：lyristage://auth/callback
  - name: LyriStage
    schemes:
      - lyristage
win:
  target: nsis
  icon: build/icon.ico
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: LyriStage
  artifactName: LyriStage-Setup-${version}.${ext}
