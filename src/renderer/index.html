<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <!--
      内容安全策略：只允许连接自己的 API、本机 API（电脑版）和 Supabase；
      ws://localhost:* 是开发时 Vite 热更新用的；字体来自 Google Fonts；
      wasm-unsafe-eval 只允许 WebAssembly（3D 公仔的模型解压要用），不允许 JS 的 eval
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self';
        script-src 'self' 'wasm-unsafe-eval';
        style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
        font-src 'self' https://fonts.gstatic.com;
        img-src 'self' data: blob: https: http:;
        media-src 'self' blob: https:;
        connect-src 'self' blob: http://127.0.0.1:10754 https://lyristage-api.vercel.app https://*.supabase.co wss://*.supabase.co ws://localhost:*"
    />
    <!--
      歌词风格用到的字体（都是 OFL 开源授权）。Google Fonts 会把中文字体切成很多小块，
      只下载页面上实际出现的字。离线使用（打包进安装包）留到阶段 6。
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@700;900&family=Noto+Sans+SC:wght@400;500;700;900&family=Ma+Shan+Zheng&family=JetBrains+Mono:wght@500&display=swap"
    />
    <title>LyriStage</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
